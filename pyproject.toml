[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecoder"
version = "0.1.0"
description = "A local Python coding agent with a Textual TUI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual",
    "prompt_toolkit",
    "openai",
    "anthropic",
    "anyio",
    "mcp>=1.28.1,<2",
    "python-dotenv",
    "PyYAML",
    "tomlkit",
    "portalocker",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tracecoder = "tracecoder.cli:main"

[tool.setuptools.packages.find]
include = ["tracecoder*"]

[tool.setuptools.package-data]
tracecoder = ["context/prompts/*.md", "app/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 200
target-version = ["py311"]
